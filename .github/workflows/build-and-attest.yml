# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Builds every release artifact, records GitHub build provenance for them,
# and publishes them to a GitHub Release.

name: Build and Attest

on:
  push:
    tags: ["v*"]
  schedule:
    # Nightly master build; skipped when the floresta-master pin is unchanged.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      attr:
        description: "Flake attribute to build: master or a pinned version (e.g. v0_9_1)"
        required: false
        default: master

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.plan.outputs.proceed }}
      publish: ${{ steps.plan.outputs.publish }}
      rev: ${{ steps.plan.outputs.rev }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_ATTR: ${{ inputs.attr }}
        run: |
          set -euo pipefail

          # A tag names its flake attribute, with dots as underscores:
          # v0.9.1 builds .#v0_9_1. A tag without a matching attribute
          # fails at nix build, which is the error message we want.
          case "$EVENT" in
            push)              base="${REF_NAME//./_}"; publish=release ;;
            schedule)          base=master;             publish=nightly ;;
            workflow_dispatch) base="${DISPATCH_ATTR:-master}"
                               if [ "$base" = master ]; then publish=nightly; else publish=none; fi ;;
          esac

          # Nightlies build the committed floresta-master pin; a scheduled
          # run on an unchanged pin would republish identical artifacts.
          # The last published pin is read back off the nightly release body.
          rev=$(jq -r '.nodes."floresta-master".locked.rev' flake.lock)
          proceed=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh release view nightly --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body 2>/dev/null \
              | sed -n 's/.*floresta-master: \([0-9a-f]\{40\}\).*/\1/p' || true)
            if [ "$rev" = "$last" ]; then
              proceed=false
              echo "floresta-master pin unchanged ($rev), nothing to publish"
            fi
          fi

          # Android cross builds exist only on master.
          matrix=$(jq -cn --arg base "$base" '
            [ {runner: "ubuntu-latest",    attr: $base, triple: "x86_64-unknown-linux-gnu"},
              {runner: "ubuntu-24.04-arm", attr: $base, triple: "aarch64-unknown-linux-gnu"},
              {runner: "macos-14",         attr: $base, triple: "aarch64-apple-darwin"} ]
            + (if $base == "master" then
              [ {runner: "ubuntu-latest", attr: ($base + ".aarch64-android"), triple: "aarch64-linux-android"},
                {runner: "ubuntu-latest", attr: ($base + ".armv7a-android"),  triple: "armv7-linux-androideabi"},
                {runner: "ubuntu-latest", attr: ($base + ".x86_64-android"),  triple: "x86_64-linux-android"} ]
              else [] end)')

          {
            echo "proceed=$proceed"
            echo "publish=$publish"
            echo "rev=$rev"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.triple }}
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and collect ${{ matrix.triple }}
        run: |
          set -euo pipefail
          mkdir -p results
          echo "::group::nix build .#${{ matrix.attr }}"
          nix build -L ".#${{ matrix.attr }}" --out-link result-release
          echo "::endgroup::"

          # One build of the release carries every artifact for this target.
          # Which files those are is read off the result, matching what
          # lib/attestation.nix hashes.
          found=0
          for dir in bin lib; do
            [ -d "result-release/${dir}" ] || continue
            for artifact in "result-release/${dir}"/*; do
              [ -f "${artifact}" ] || continue
              cp -L "${artifact}" "results/$(basename "${artifact}")-${{ matrix.triple }}"
              found=$((found + 1))
            done
          done
          [ "${found}" -gt 0 ] || { echo "error: ${{ matrix.attr }} produced no files under bin/ or lib/" >&2; exit 1; }
          chmod -R u+w results
          ls -l results

      - name: Upload ${{ matrix.triple }}
        uses: actions/upload-artifact@v7
        with:
          name: floresta-${{ matrix.triple }}
          path: results/*
          if-no-files-found: error
          retention-days: 3

  attest-and-release:
    name: Attest and Release
    if: needs.plan.outputs.publish == 'release'
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: results
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd results
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            results/*
            !results/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: results/*

  nightly:
    name: Publish Nightly
    if: needs.plan.outputs.publish == 'nightly'
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd results
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            results/*
            !results/SHA256SUMS

      # Same asset names every night, so re-uploading replaces last
      # night's copies. The body records the pin the plan job checks.
      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (master)
          prerelease: true
          body: |
            Rolling build of the `master` flake attribute. Not attested by
            independent builders — broader purposes, not for verification.

            floresta-master: ${{ needs.plan.outputs.rev }}
          files: results/*
