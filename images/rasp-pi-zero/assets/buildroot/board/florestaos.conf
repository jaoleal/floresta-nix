# florestaos.conf — Floresta Pi Zero bench lab configuration.
#
# Edit this file from any OS (it lives on the FAT partition), put the
# card back in the Pi, power on.  The boot scripts parse it with safe
# defaults: a malformed value falls back to its default and leaves a
# warning in results/boot-<timestamp>.log, where the effective
# configuration is always echoed.
#
# Lines are `key=value`, `#` starts a comment, unknown keys are ignored.

# What the box does after boot:
#   node        - run florestad as a normal service
#   bench-micro - offline CPU/SD microbenchmarks, write CSV, then
#                 poweroff (see bench_end)
#   bench-ibd   - full IBD from genesis with the sampler running
#                 (WIPES /data/floresta on every boot in this mode!)
#   bench-assume- IBD starting from assume-utreexo, sampler running
#                 (also wipes /data/floresta on every boot)
mode=node

# bitcoin | signet | testnet4
network=signet

# node mode only: set to false to make the regular node do a full IBD.
# The bench modes decide this themselves (bench-ibd forces it off,
# bench-assume forces it on).
assume_utreexo=true

# hardcoded | 0 | <block hash>
# `0` disables assume-valid: every script back to genesis is verified.
# That is the heaviest, most honest benchmark this board can run.
assume_valid=hardcoded

# bench-ibd / bench-assume: stop when the chain reaches this height
# (0 = no height limit) or after this many hours, whichever first.
ibd_stop_height=0
ibd_time_budget_hours=48

# Seconds between sampler rows, and how many rows between syncs of the
# CSV to results/ on this FAT partition.
sample_interval_secs=60
results_sync_every=5

# What to do when a bench finishes: poweroff | idle
bench_end=poweroff

# USB network. ecm works out of the box on Linux and macOS hosts;
# set rndis for a Windows host.
usb_gadget=ecm
# Pi side of the USB link, CIDR notation. The host side gets
# usb_gateway (and NATs the Pi to the internet — see the README).
usb_ip=10.7.0.2/24
usb_gateway=10.7.0.1

# DNS server and NTP pool used once the USB network is up.
dns=1.1.1.1
ntp_server=pool.ntp.org

# Compressed swap in RAM, MB (0 disables). 512 MB of RAM needs the
# headroom during IBD, and zram beats swapping onto the SD card.
zram_mb=256

# Extra flags appended verbatim to the florestad command line.
extra_flags=
